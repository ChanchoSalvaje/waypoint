# Netlify configuration for the Pipeline Command Center (Slice 1 — read-only).

[build]
  # Only the public/ folder is deployed as the website. .env stays at the repo
  # root and is NEVER uploaded. Serverless + edge functions live under netlify/.
  publish = "public"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[dev]
  publish = "public"
  framework = "#static"

# ATS Watchlist polling was retired 2026-08-29 (discovery is title/fit-driven;
# all Watchlist rows are Paused). The daily schedule that used to live here was
# removed 2026-09-22. poll-ats-background.js stays in the repo and can still be
# started by hand through poll-ats-now.js. To bring the daily run back, re-add:
#   [functions."poll-ats-background"]
#     schedule = "0 19 * * *"

# Password gate: this edge function runs on EVERY request (path "/*") — including
# the /.netlify/functions/jobs data endpoint — and returns 401 unless the correct
# Basic Auth credentials are supplied. Credentials come from env vars, never code.
[[edge_functions]]
  path = "/*"
  function = "auth"
